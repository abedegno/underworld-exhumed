# a restore while falling (issue 10's port difference): the way to Bragit's room as talk's (the
# Red Key, the door at (22,5) opened), then west along row 5 to the wall at (16,5) (fourteen steps,
# so that a step a slope refuses does not matter), north to (16,6), and west along the corridor
# with fixed steps over the slope at (10,6) to the platform at (9,6), height B, facing north; a
# save to slot I there ("edge"), w held a second, which runs north off the platform, ten heights
# down into the corridor at (9,7), and Ctrl+R and Enter while the player is still falling. A
# restore does not reset the player's motion (PN), and check_physics caps the first step after
# it at 40h units, so space_to_motion's MP.vel[MP.major] * CP->time is 821 * 64 = 52544 and then
