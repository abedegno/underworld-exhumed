# Exhume project configuration for Ultima Underworld: The Stygian Abyss (UW.EXE, DOS, 1992,
# the GOG release). The same toolchain as UW2 (Turbo C++ 1.01, TASM 2.0, TLINK 3.01).

[project]
name = "UW1"
root = "${UW1DECOMP:-.}"                # the directory this file is in, unless UW1DECOMP names another
src = "${EXHUME_SRC:-src}"
targets = "targets"
symbols = "${EXHUME_SYMBOLS:-symbols.tsv}"
matched = "${EXHUME_MATCHED:-matched.txt}"
map = "${EXHUME_MAP:-map}"
build = "${EXHUME_BUILD:-build}"
queue = "queue"
exclude = ["port"]                     # relative to src: the native port's own C (src/port), which the DOS build never compiles

[binary]
exe = "${UW1_EXE:-~/UWGOG/UW1/UW.EXE}"
# DGROUP: fingerprint.py's suggestion from C0's copyright (DS:0 at file 0x5DCC0); to be
# confirmed with a string the code addresses by DS offset
dgroup_para = 0x5AAC
overlay_segment = "ovr(\\d{3})"
# UWReverseEngineering's UW1_asm.asm (input MD5 8AFC3C29EF5667A3AB6667E8CBC8D63A, the GOG UW.EXE);
# a segment name's paragraph is the load paragraph + 0x1ED, as in UW2 (dseg_5c99 is DGROUP at 0x5AAC)
listing = "${UW1_ASM:-~/UWReverseEngineering/UW1_asm.asm}"
listing_para_bias = 0x1ED
listing_stub_prefix = "stub"
# the listing names segments without their paragraph; code segments are found through
# map/segments.tsv, and the modding build needs seg051 (FD58, 4723), which holds the model
# interpreter's opcode table at 2738h (docs/LAYOUT.md)
listing_segments = { seg051 = 0x4723 }

[toolchain]
profile = "borland-tc101"
home = "${EXHUME_TC:-../uw2/TC}"
stage = ["${EXHUME_TC:-../uw2/TC}", "${EXHUME_TASM:-../uw2/TASM}/TASM.EXE"]
c_opts = "-mm -1 -G -O -Z"

[map]
library_segments = ["seg000"]

[run]
data = "${UW1_DATA:-~/UWGOG/UW1}"
exe_name = "UW.EXE"

[names]
# UW1 has no build with symbols; its names come from UW2's matched sources through kin.py
# (UW2's names are the FM Towns build's originals)
original_label = "UW2 kin"

[repocheck]
# UW1's data formats, never to be committed (tools/repocheck.py)
ban = ["GR", "DAT", "BYT", "TR", "ARK", "PAK", "OLB", "CM", "CFG", "VOC", "XMI", "ADV", "N00", "N01", "N02", "N03", "N04", "N05", "N06", "N07", "N08", "N09", "N10"]
# the sound configurations recorded with the replay sessions are ours, not the game's
allow = ["^tests/replay/[a-z]+\\.cfg$"]

[gate]
# tools/gate.py: the build driver and the gate (Exhume's skills/readability-pass). The exact
# link is byte-identical to UW.EXE, so there are no known_diffs (docs/LINKING.md).
link = "{python} tools/link.py --config {config}"
mod_link = "{python} tools/link.py --mod --config {config}"
exact_exe = "LINK/out/UW.EXE"
mod_exe = "MODLINK/out/UW.EXE"
# `gate.py boot`: the title, then the main menu
boot = ["w:8000", "s:title", "k:Escape", "w:4000", "s:menu"]

[layout]
# tools/addrscan.py, which lists addresses written as numbers (docs/link.md, "Layout audits";
# docs/LAYOUT.md). Segment table entry 50 is C0's empty _FARDATA; entries 51 to 76 are the far
# data segments, reported as FD51..FD76 (FD52 is seg048, 3963, the graphics library's data;
# FD72 seg063, seg019's).
far_data_entries = [51, 76]
# seg046 (src/lib/OVERLAY.ASM) is the overlay manager, which the link takes from OVERLAY.LIB
# rather than from its object; named by segment, so a renamed file needs no change
library_objects = ["seg046"]
# seg003's dispatchers (GRDISP's _seg003_5B0B and the path at _seg003_5AF9) are handed a near
# routine of seg003 in BP and call it with DS = ES = seg048 and SS = the word at seg048:558A,
# which holds `dd seg048` (GRDISP's FD52 piece): DS = ES = SS = FD52
dispatch = [{ register = "bp", ds = "FD52", es = "FD52", ss = "FD52" }]

[port]
# The native port (Exhume's docs/port.md): Exhume's tools/portcheck.py, portbuild.py,
# portstubs.py, layoutcheck.py, intaudit.py. src/port holds UW1's bindings for Exhume's runtime
# (portgame.h, asmgame.h, ailgame.h), the C that replaces UW1's assembly modules and DOS-only C,
# the translated modules and the link stubs; the runtime (Exhume's runtime/, compiled in place,
# never copied) is the rest, and src/include has UW1's hookgame.h and rpgame.h for portable.h
# and replay.c.
dir = "src/port"
out = "port"                           # <build>/port, <build>/port-debug, <build>/port-cov
exe = "uw1port"
backend = "sdl3"
optimise = ["3d", "gfx", "x86"]        # the translated modules, their machine and the graphics C: -O2
extracted_by = "tools/extract.py"

[[port.vendor]]
# Nuked OPL3, the FM chips' emulator: fetched by Exhume's tools/setup-sound.sh (make setup-sound,
# make setup-port), never committed (LGPL-2.1; Exhume's docs/third-party.md); a shared library
# of its own in the release build
name = "Nuked OPL3"
dir = "tools/nuked-opl3"
sources = ["opl3.c"]
define = "AUDIO_HAVE_OPL"
for = "sound/audio.c"
missing = "no OPL emulator (make setup-sound)"

[[port.pkg]]
# libmt32emu (munt, LGPL-2.1-or-later), the MT-32's emulator, linked dynamically when pkg-config
# finds it
name = "mt32emu"
define = "AUDIO_HAVE_MT32EMU"
for = ["sound/audio.c", "sound/mt32roms.c"]
label = "libmt32emu"
missing = "no libmt32emu (brew install mt32emu, or make setup-libs)"

# The web build (portbuild.py --web): the calls whose declaration in the calling file differs from
# the function's definition, as the original's do (Turbo C and the desktop let a call with more or
# fewer arguments, or another return type, through; WebAssembly's linker makes each a trap), are
# renamed in that file to an adapter of the caller's type, in src/port/sys/webcalls.c, which
# calls the definition. The arguments the adapters drop or supply are ones the function never
# reads.
[port.web.renames]
"src/conv/CONVERSE.C" = ["grfx_load_font=web_grfx_load_font_void", "mantra_advance=web_mantra_advance_int"]
"src/conv/BARTER.C" = ["grfx_load_font=web_grfx_load_font_void"]
"src/obj/USEITEMS.C" = ["ExplodingBook_ovr107_1259=web_ExplodingBook_void", "mantra_advance=web_mantra_advance_int"]
"src/ui/MAINMENU.C" = ["player_setup=web_player_setup_how"]
"src/combat/SPELLS.C" = ["player_setup=web_player_setup_how"]
"src/game/UWEDIT.C" = ["player_setup=web_player_setup_how"]

[port.web.allow_mismatch]
# wasm-ld's signature mismatches the web build accepts (any other fails it)
valloc = "the game's valloc (VALLOC.ASM, src/port/gfx/asmentry.c) replaces the C library's weak one, as on the desktop; the library never calls it"

[port.stub_notes]
# what each generated stub file's names are, for its header (tools/portstubs.py)
"exedata.c" = "the far data tools/extract.py takes from UW.EXE"
"dgroup.c" = "the DGROUP gaps tools/extract.py places (data no C source defines yet)"
"borland.c" = "Borland's C library (the port's stand-in headers and compat.h)"

[port.layout]
# tools/layoutcheck.py: the records UW1 reads from or writes to its files, or lays over bytes
# read from them; each must have the same layout on the host as under Turbo C
io_calls = ['fread', 'fwrite', 'read', 'write', 'intoFarBuffer\w*', 'FarWrite\w*', 'movedata', 'memcpy',
            'memmove', '_fmemcpy', 'xorread', 'xorwrite']
# (not get_arc and put_arc: UW1's take the archive's struct Arc as their handle, and move the
# block through a void far *)
[port.layout.file_records]
Player = "PLAYER.DAT: PLAYDATA.C's xorread and xorwrite move sizeof(struct Player), 0xD2 bytes"
PlayerStore = "PlayerDat, the same 0xD2 bytes seen whole"
LevelBlock = "a LEV.ARK level block, 0x7C08 bytes, read and written whole (MAP.C's get_arc and put_arc into mapdata)"
Object = "the mobile object records inside a LevelBlock"
StaticObj = "the 8-byte static object records inside a LevelBlock"
Tile = "the tile map inside a LevelBlock"
Link = "the link words inside objects and tiles"
Anim = "the animation overlay records of LEV.ARK (EFFECT.C's get_arc and put_arc of animlist)"
ATM = "the automap note records of LEV.ARK (AUTOMAP.C's get_arc and put_arc of ATM_Strings)"
Creature = "OBJECTS.DAT critter records, 0x30 bytes each (CREATURE.C's fread)"
ComObj = "COMOBJ.DAT, the common object table (OBJCLASS.C's fread)"
Weapon = "OBJECTS.DAT weapon records (HACK.C's fread, 8 bytes each)"
MissileInfo = "OBJECTS.DAT missile records (HACK.C's fread, 3 bytes each)"
Armour = "OBJECTS.DAT armour records (HACK.C's fread, 4 bytes each)"
Container = "OBJECTS.DAT container records (MISC.C's fread, 3 bytes each)"
Light = "OBJECTS.DAT light records (MISC.C's fread, 2 bytes each)"
AnimClass = "OBJECTS.DAT animation classes (ANIMOBJ.C's fread, 4 bytes each)"
FontInfo = "the 12-byte header of a .SYS font file (GRFX.C's intoFarBuffer into cur_font)"
Bitmap = "the header of a picture read from an art file (grs_unpack over the bytes read)"

# CI: the repository's ci.toml, with both games' values (docs/BUILDING.md, "Continuous
# integration" at the top of the repository)

[package]
# Exhume's tools/package.py (make package) and tools/icons.py: the players' packages, UW1.app on
# macOS, as UW2Decomp's are UW2.app (docs/BUILDING.md, "Releases")
name = "UW1"
title = "Ultima Underworld"
comment = "Native port of Ultima Underworld: The Stygian Abyss (needs your own copy of the game)"
bundle_id = "io.github.abedegno.uw1port"
# this game's release tags in underworld-exhumed (uw1-v1.0.0), for a local package's version
tag_prefix = "uw1-"
launcher = "uw1"
category = "public.app-category.role-playing-games"
copyright = "Port code MIT licence, abedegno. Ultima Underworld is copyright Electronic Arts; bring your own copy."

[fuzz]
# Exhume's tools/fuzzasm.py (make fuzz, and make test's quick run): UW1's routine targets and
# fuzzhost.c's UW1 side (the regions, the C entries)
targets = "tools/fuzz_targets.py"
host_glue = "tools/fuzzhost-uw1.c"
main = "sys/main.c"                    # the port file fuzzhost replaces

[vectors]
# Exhume's tools/vectors.py (make vectors): game rules computed by UW.EXE's own routines, written
# to vectors/ for reimplementations to be checked against (vectors/README.md); the port's side
# (vectorhost-uw1.c) must agree with the EXE on every case
targets = "tools/vector_targets.py"
host_glue = "tools/vectorhost-uw1.c"
out = "vectors"

[asm2c]
# Exhume's tools/asm2c.py: the modules UW1's port translates, its code segments, hand-written
# ranges and overrides (UW1's own, so they live here)
spec = "tools/asm2c_spec.py"

[sound]
# Exhume's tools/ailcheck.py: UW1's AIL 2 music drivers, by the kinds of Exhume's
# runtime/port/sound/aildrv.h, in the game's directory ([replay] data): Ad Lib, Sound Blaster FM,
# SB Pro (two YM3812s: its description table names "AD", not "OPL"), Pro Audio Spectrum, MT-32
drivers = { 1 = "SOUND/ADLIB.ADV", 2 = "SOUND/SBFM.ADV", 3 = "SOUND/SBPFM.ADV", 4 = "SOUND/PASFM.ADV", 6 = "SOUND/MT32MPU.ADV" }
# the project's own C for the sound library: the FM drivers' time-variant effects (Origin's
# ALE.INC, UW2Decomp's translation, the same code in UW1's SBFM.ADV), which plug into the
# runtime's sound/yamaha.c as uw1_tvfx (src/port/ailgame.h's AIL_FM_EXT)
extensions = ["src/port/sound/tvfx.c"]

[replay]
# the graphics engine's data (seg048 in UW1, seg003 in UW2): the renderer's working memory, which a
# rendering enhancement changes by design; enhcheck.py presentation ignores it with the screen
renderer_sections = ["GFX"]
# the colour the hole probe (enhcheck.py holes, UW1PORT_HOLE_PROBE) clears the 3D view to: one no
# session's frames draw
hole_mark = 42
# the session enhcheck.py coverage replays to prove --enhance perspective covers the original
# mappers' pixels exactly (UW1PORT_TEXTURE_PROBE; src/port/gfx/perspmap.c)
coverage_session = "walk"
# The record and replay harness (Exhume's docs/port.md, "Verifying a port"; docs/BUILDING.md,
# "Recording and replaying a session"): Exhume's tools/replay.py, golden.py, replaydos.mjs.
# Sessions are tests/replay/NAME.rec with NAME.cfg, the DATA\UW.CFG it ran with; goldens
# tests/replay/golden/NAME. The record and replay code is Exhume's runtime/replay/replay.c,
# compiled where it is, with src/include/rpgame.h.
sessions = "tests/replay"
golden = "tests/replay/golden"
magic = "UW1R"
exe_name = "UW.EXE"
data = "${UW1_DATA:-~/UWGOG/UW1}"
# the saved games already in the game's directory: every session starts with none
data_skip = ["SAVE1/", "SAVE2/", "SAVE3/", "SAVE4/"]
cfg_path = "DATA/UW.CFG"
saves = ["SAVE1", "SAVE2", "SAVE3", "SAVE4"]
shared_opts = "-mm -1 -G -O -Y -d"     # replay.c in the replay DOS build, as UW2's
# the replay DOS build's link: the modding build, to which replay.py adds --out, --obj, --add
link = "{python} tools/link.py --mod --config {config}"
order = ["newgame", "walk", "sound", "soundfm", "soundmt", "items", "talk", "load", "intro", "savecursor", "female", "fallrestore", "tooheavy", "fallpause", "overpay", "powerkill"]
c0_signature_at = 8                    # DS:8, after DS:0..3 (an overlay stub's tail) and C0's DS:4..7
# tooheavy starts from the saved game setup/tidy-heavy writes: a port-made setup session whose
# script uses a test's cheats (recording format 6), which only the port replays, so its saved
# game comes from the port's replay in golden and verify alike, and DOS judges tooheavy from it
# fallpause, overpay and powerkill were recorded by the port from input scripts
# (tests/replay/NAME.script; no cheats, so format 4, which DOS replays), and have no steps here:
# js-dos runs the game flat out, at which a walking player hardly moves, and its steps cannot
# drag the mouse. Their goldens are DOS's replays all the same; overpay and powerkill start
# from setup sessions, as tooheavy does
stage_from = { load = "items", tooheavy = "setup/tidy-heavy", fallpause = "fallrestore", overpay = "setup/trader", powerkill = "setup/headless" }
# the port's driver logs, and the real drivers run against them (Exhume's tools/ailcheck.py)
port_sound_logs = ["--ail-log", "--hw-log"]
driver_check = "{python} {exhume}/tools/ailcheck.py --config {config} {ail} {hw}"
driver_marker = "register_driver"      # a session whose AIL log registers no driver has no music card
# sound's DOS replays run in js-dos: in DOSBox-X (2026.10.01, sb16 or sbpro2, either core,
# mixer on or off) the replay hangs once the introduction starts its speech on SBDIG.ADV, where
# js-dos replays it to the end, twice identical. soundfm, with no speech card, replays in both.
dos_backend = { sound = "jsdos" }


[replay.segments]
# far pointers kept in game state. SEGS' first block is seg048 (EXE paragraph 3963h, the
# graphics library's data, palette's segment), and every paragraph from the far data (FD51 at
# 395Bh) up moves with the load segment, DGROUP and the far heap above the program included.
# The slots are the segment words the sessions have in seg048's data: POLYFILL's texture
# segment at 07AF (filled from the polygon record, a far heap block), the far pointers at 07D4,
# 095A, 0B0E and 0B1C, GRDISP's saved SS at 558A, and at 55EA the segment VIDMODE.ASM draws to
# (A000h, the screen, which SEGS lists, or a buffer). Each was seen to differ between DOSBox-X
# and js-dos by exactly the difference of their load segments, or to be A000h in both.
first_block_para = 0x3963
exe_range = [0x395B, 0xA000]
# SEGS word 6 is mapdata, a far heap block: the far heap starts where the build's size puts it
# (the replay build's moved by a paragraph when USEITEMS.C's FARNULLTRAP marks made it 272 bytes
# larger), so the heap blocks in the slots are compared by their distance from it
heap_block = 6
# the far heap starts at the load segment + 6955h (the port, PORT_HEAP_FIRST) or 6956h (the
# replay build as it stands), above the image (6250h), the stack and the overlay buffer; no
# far data or stack segment in the slots is above 6900h
heap_from = 0x6900
slots = { "GFX" = [0x7AF, 0x7D4, 0x95A, 0xB0E, 0xB1C, 0x558A, 0x55EA] }

[replay.nulls]
# DS:0..3 is the tail of the last overlay stub entry (the EXE has 3F F1 02 00 there, measured):
# 3F F1 02 00 while its overlay is not loaded, and F1 02 and the overlay's segment while it is
ds_forms = ["3ff10200", "f102????"]
sum_from = 4                           # C0 sums DS:4..30h, from DATASEG@ (tools/link.py's c0_source)
sum_to = 0x31
sum_expect = 0xCA5

[[replay.mask]]
section = "GFX"
lo = 0x4DFE
hi = 0x4FA6
scope = "always"
why = "GRCORE.ASM's private stack (it switches to 3963:4FA6; UW2's is 370D:4E00..4FA8): interrupts push onto it whenever they come"
[[replay.mask]]
section = "GFX"
lo = 0x547E
hi = 0x5546
scope = "always"
why = "the stack GRENTRY.ASM and GRDISP.ASM switch to (SP 5546h, from 3963:5586; UW2's 5480..5548): interrupts push onto it"
[[replay.mask]]
section = "GFX"
lo = 0x652
hi = 0x654
scope = "always"
why = "GRMISC.ASM's _46: the low word of the real clock after each 3D frame, for the retrace wait's time-out"
[[replay.mask]]
section = "GFX"
lo = 0x5588
hi = 0x558C
scope = "cross"
why = "GRDISP.ASM's saved SP (5588) and SS (558A)"
[[replay.mask]]
section = "NULL"
lo = 0x6F                              # 33h + 4 * 0Fh
hi = 0x73
scope = "always"
why = "IRQ 7's vector (int 0Fh): SBDIG.ADV points it at its handler while a buffer plays (the introduction's speech in the sound session), so whether a checkpoint catches it depends on the emulator's DMA timing, not on game state (as UW2's config masks it); two DOS runs of sound differed only here, one night in three"

[[replay.string_junk]]
# GRCORE's string entries copy the string, its 0 and one byte more to 3963:4FA6
section = "GFX"
start = 0x4FA6
len = 0x84
[replay.cfgs]
# DATA\UW.CFG for each session (SOUND.C's seg014_1DC5_1D0D reads the first two lines, UWEDIT.C
# skips the third): the music card (0 none, 3 Sound Blaster FM, SBFM.ADV, or 6 Roland MT-32,
# MT32MPU.ADV, on the MPU-401 at 330h) and the speech card (0 none, 1 Sound Blaster digital,
# SBDIG.ADV), each with its IRQ, port (hex) and DMA. Every session has one, so that none depends
# on the configuration in the player's copy of the game.
newgame = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
walk = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
items = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
talk = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
load = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
intro = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
savecursor = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
female = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
fallrestore = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
tooheavy = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
fallpause = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
overpay = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
powerkill = "0 -1 -1 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
sound = "3 7 220 1 sound\r\n1 7 220 1 speech\r\n0 cuts\r\n"
soundfm = "3 7 220 1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"
soundmt = "6 2 330 -1 sound\r\n0 -1 -1 -1 speech\r\n0 cuts\r\n"

[replay.derive]
# soundfm: sound with no speech card; soundmt: on a Roland MT-32, with every wait doubled
# (MT32MPU.ADV uploads each theme's timbres before it plays, so the way in takes longer)
soundfm = { from = "sound" }
soundmt = { from = "sound", wait_scale = 2 }

[replay.steps]
# Steps for Exhume's tools/replaydos.mjs. Timings are generous: the recording does not depend on
# them, only on the inputs arriving where the game reads them. "@NAME" takes NAME's steps; a
# name starting with _ is not a session. Pointer moves are a corner slam (M), then a move in
# the 640 by 400 frame. In UW1 the right button does what the mode icon says and the left moves.
# The way into the game: the title, Escape (no saved game, so the introduction starts), Escape
# (the main menu), Enter (Create Character), Enter for every default (male, right-handed,
# fighter, the skill picks, the portrait, standard difficulty), the name Avatar, Enter, and Yes
_chargen = [
    "w:9000", "k:Escape", "w:3000", "k:Escape", "w:3000", "k:Enter", "w:3000", "k:Enter",
    "w:2000", "k:Enter", "w:2000", "k:Enter", "w:2000", "k:Enter", "w:2000", "k:Enter", "w:2000",
    "k:Enter", "w:2000", "k:Enter", "w:2000", "k:Enter", "w:2000", "t:Avatar", "w:1000", "k:Enter",
    "w:2000", "k:Enter"
]
# boot, the title, the main menu, a new character, sixteen seconds in the game;
# tools/replaydos.mjs then sends F12
newgame = ["@_chargen", "w:4000", "s:ingame1", "w:6000", "s:ingame2", "w:6000"]
# a female character with the last portrait (issue 8): the way in as _chargen's, but Down before
# Enter at the sex question and Down four times before Enter at the portraits. Her bodies are
# CHRBTNS.GR's pictures 22 to 26, and every one after the first starts past 7FFFh in the
# pictures' block, where CHARGEN.C's offsets were signed on the host and the port stopped
female = [
    "w:9000", "k:Escape", "w:3000", "k:Escape", "w:3000", "k:Enter", "w:3000", "k:ArrowDown",
    "w:800", "s:sex", "k:Enter", "w:2000", "k:Enter", "w:2000", "k:Enter", "w:2000", "k:Enter",
    "w:2000", "k:Enter", "w:2000", "k:Enter", "w:2000", "s:portraits", "k:ArrowDown", "w:600",
    "k:ArrowDown", "w:600", "k:ArrowDown", "w:600", "k:ArrowDown", "w:800", "s:portraitsel",
    "k:Enter", "w:2000", "s:portrait", "k:Enter", "w:2000", "t:Avatar", "w:1000", "k:Enter",
    "w:2000", "k:Enter", "w:4000", "s:ingame1", "w:6000", "s:ingame2", "w:3000"
]
# the way into the game, then about forty seconds in the 3D view: walk forward (w held), turn
# left and right (a, d), look up and down and level again (3, 1, 2), step back (s), slide (z,
# c) and press the left button in the view, so that frames from many positions, a pitched view
# and a pick frame are compared
walk = [
    "@_chargen", "w:6000", "s:ingame1", "h:w,1200", "w:800", "h:a,700", "w:600", "h:w,1500",
