# make test, the accuracy suite (docs/BUILDING.md, "Testing" and "Continuous integration"):
# the byte-exact DOS build gate, the port build, the quick routine fuzzing and every replay
# session against their goldens, on Linux. Then the same sessions replayed by the port
# built on Windows (MSYS2 CLANG64) and on macOS against the same goldens (make verify): the
# goldens are DOS's, so these show the port on each OS runs the game as DOS does. They need
# the game, and the gate the Borland toolchain, which come from the private bundle (the
# game's assets action), so the jobs run only where the repository's secrets are given: pushes
# to main, a manual run, and pull requests from branches of this repository. A pull request
# from a fork gets port.yml and repocheck.yml, which need no secrets.
name: uw1-accuracy
on:
  push:
    paths:
      - 'coop/**'
      - 'tests/coop/**'
      - 'uw1/**'
      - 'exhume'
      - '.gitmodules'
      - '.gitattributes'
      - 'docs/**'
      - '.github/**'
      - 'ci.toml'
      - 'Makefile'
    branches: [main]
  pull_request:
    paths:
      - 'coop/**'
      - 'tests/coop/**'
      - 'uw1/**'
      - 'exhume'
      - '.gitmodules'
      - '.gitattributes'
      - 'docs/**'
      - '.github/**'
      - 'ci.toml'
      - 'Makefile'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uw1-accuracy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  make-test:
    if: (vars.UW1_CI_ASSETS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    # make test with every enhancement's checks (each presentation enhancement replays every
    # session): about 50 minutes on the hosted runners for UW1
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/uw1-linux-tools
      - uses: ./.github/actions/uw1-assets
        with:
          deploy-key: ${{ secrets.UW1_ASSETS_DEPLOY_KEY }}
          age-key: ${{ secrets.UW1_ASSETS_AGE_KEY }}
      - name: Unpack Turbo C++ and TASM from the bundle's disk images
        run: sh exhume/profiles/borland-tc101/setup-tc.sh "$TC_DISKS" toolchain/TC && sh exhume/profiles/borland-tc101/setup-tasm.sh "$TASM_DISKS" toolchain/TASM && printf 'EXHUME_TC=%s\nEXHUME_TASM=%s\n' "$PWD/toolchain/TC" "$PWD/toolchain/TASM" >> "$GITHUB_ENV"
      - name: make -C uw1 test
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          make -C uw1 test 2>&1 | tee "$RUNNER_TEMP/logs/make-test.log"
      # Only pictures and text logs: the difference pictures of a session that differs from its
      # golden, the port's own log of each replay, and this run's output. Never the state dumps,
      # the saved games, objects, EXEs or anything else under build/.
      - name: "MT-32: how the port finds the ROMs, and soundmt's audio"
        run: |
          py=$(command -v python3 || command -v python)
          "$py" exhume/tools/romcheck.py --exe uw1/build/port/uw1port --data "$UW1_DATA" --roms "$MT32_ROMS" --env UW1PORT_MT32_ROMS --sound 6,1 --split "$MT32_ROMS-split"
          "$py" exhume/tools/audiocheck.py --exe uw1/build/port/uw1port --data "$UW1_DATA" --rec uw1/tests/replay/soundmt.rec --cfg uw1/tests/replay/soundmt.cfg --roms "$MT32_ROMS" --digests uw1/tests/replay/audio
      - name: Upload the difference pictures and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: make-test-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/logs/*.log
            uw1/build/replay/verify/**/diff_ck*.png
            uw1/build/replay/verify/**/port.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the game data and everything built from it
        if: always()
        run: rm -rf "$RUNNER_TEMP/uw1-assets" "$RUNNER_TEMP/uw1-ci-assets" "$RUNNER_TEMP/uw1-assets-deploy-key" toolchain uw1/build

  # The port only: no DOS and no Borland toolchain (replay.py verify needs neither; without
  # Turbo C++ it does not check the goldens against the replay DOS build).
  verify-windows:
    if: (vars.UW1_CI_ASSETS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # the recordings and scripts must keep their bytes and LF line ends (also .gitattributes)
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: make curl git
          pacboy: clang:p llvm:p pkgconf:p sdl3:p python:p cmake:p ninja:p
      # age's own Windows build at a pinned version, checked against its SHA-256, for the
      # uw1-assets action (which runs in Git Bash)
      - name: age
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'age.zip'
          Invoke-WebRequest -Uri 'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-windows-amd64.zip' -OutFile $zip
          $sum = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne 'f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7') { throw "age: unexpected SHA-256 $sum" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'age-bin')
          Join-Path $env:RUNNER_TEMP 'age-bin\age' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: ./.github/actions/uw1-assets
        with:
          deploy-key: ${{ secrets.UW1_ASSETS_DEPLOY_KEY }}
          age-key: ${{ secrets.UW1_ASSETS_AGE_KEY }}
      - name: Cache libmt32emu
        uses: actions/cache@v6
        with:
          path: uw1/tools/libs
          key: libs-windows-clang64-${{ hashFiles('exhume/tools/setup-libs.sh') }}
      - name: Build libmt32emu (when not cached), fetch Nuked OPL3
        run: |
          SETUP_LIBS=mt32emu sh exhume/tools/setup-libs.sh uw1/tools/libs
          sh exhume/tools/setup-sound.sh uw1/tools/nuked-opl3
      - run: make -C uw1 PY=python port
      - name: The sessions against the goldens
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          make -C uw1 PY=python verify 2>&1 | tee "$RUNNER_TEMP/logs/verify-windows.log"
      - name: "MT-32: how the port finds the ROMs, and soundmt's audio"
        run: |
          py=$(command -v python3 || command -v python)
          "$py" exhume/tools/romcheck.py --exe uw1/build/port/uw1port --data "$UW1_DATA" --roms "$MT32_ROMS" --env UW1PORT_MT32_ROMS --sound 6,1 --split "$MT32_ROMS-split"
          "$py" exhume/tools/audiocheck.py --exe uw1/build/port/uw1port --data "$UW1_DATA" --rec uw1/tests/replay/soundmt.rec --cfg uw1/tests/replay/soundmt.cfg --roms "$MT32_ROMS" --digests uw1/tests/replay/audio
      - name: Upload the difference pictures and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-windows-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/logs/*.log
            uw1/build/replay/verify/**/diff_ck*.png
            uw1/build/replay/verify/**/port.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the game data and everything built from it
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/uw1-assets" "$RUNNER_TEMP/uw1-ci-assets" "$RUNNER_TEMP/uw1-assets-deploy-key" uw1/build

  package-windows:
    if: (vars.UW1_CI_ASSETS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && github.actor != 'dependabot[bot]'
    # Windows Server 2022, the hosted Windows nearest Windows 10: the players' zip, unpacked and
    # started with only Windows's folders on the PATH (a DLL missing from the zip stops it), then
    # the sessions replayed by that program against the goldens (Exhume's tools/pkgcheck.py)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # the recordings and scripts must keep their bytes and LF line ends (also .gitattributes)
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: make curl git
          pacboy: clang:p llvm:p pkgconf:p sdl3:p python:p cmake:p ninja:p
      # age's own Windows build at a pinned version, checked against its SHA-256, for the
      # uw1-assets action (which runs in Git Bash)
      - name: age
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'age.zip'
          Invoke-WebRequest -Uri 'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-windows-amd64.zip' -OutFile $zip
          $sum = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne 'f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7') { throw "age: unexpected SHA-256 $sum" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'age-bin')
          Join-Path $env:RUNNER_TEMP 'age-bin\age' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: ./.github/actions/uw1-assets
        with:
          deploy-key: ${{ secrets.UW1_ASSETS_DEPLOY_KEY }}
          age-key: ${{ secrets.UW1_ASSETS_AGE_KEY }}
      - name: Cache libmt32emu
        uses: actions/cache@v6
        with:
          path: uw1/tools/libs
          key: libs-windows-clang64-${{ hashFiles('exhume/tools/setup-libs.sh') }}
      - name: Build libmt32emu (when not cached), fetch Nuked OPL3
        run: |
          SETUP_LIBS=mt32emu sh exhume/tools/setup-libs.sh uw1/tools/libs
          sh exhume/tools/setup-sound.sh uw1/tools/nuked-opl3
      - name: The players' package, unpacked, started and replayed
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          (make -C uw1 PY=python port-release && make -C uw1 PY=python package && exe=$(python exhume/tools/pkgcheck.py "$(ls uw1/build/dist/*-windows-x86_64.zip)" --exe uw1port --data "$UW1_DATA" --unpack "$RUNNER_TEMP/pkg") && EXHUME_PORT="$exe" make -C uw1 PY=python verify) 2>&1 | tee "$RUNNER_TEMP/logs/package-windows.log"
      - name: Upload the difference pictures and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-windows-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/logs/*.log
            uw1/build/replay/verify/**/diff_ck*.png
            uw1/build/replay/verify/**/port.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the game data and everything built from it
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/uw1-assets" "$RUNNER_TEMP/uw1-ci-assets" "$RUNNER_TEMP/uw1-assets-deploy-key" uw1/build

  verify-macos:
    if: (vars.UW1_CI_ASSETS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && github.actor != 'dependabot[bot]'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Homebrew packages
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install sdl3 mt32emu pkgconf age
      - uses: ./.github/actions/uw1-assets
        with:
          deploy-key: ${{ secrets.UW1_ASSETS_DEPLOY_KEY }}
          age-key: ${{ secrets.UW1_ASSETS_AGE_KEY }}
      - run: sh exhume/tools/setup-sound.sh uw1/tools/nuked-opl3
      - run: make -C uw1 port
      - name: The sessions against the goldens
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          make -C uw1 verify 2>&1 | tee "$RUNNER_TEMP/logs/verify-macos.log"
      - name: "MT-32: how the port finds the ROMs, and soundmt's audio"
        run: |
          py=$(command -v python3 || command -v python)
          "$py" exhume/tools/romcheck.py --exe uw1/build/port/uw1port --data "$UW1_DATA" --roms "$MT32_ROMS" --env UW1PORT_MT32_ROMS --sound 6,1 --split "$MT32_ROMS-split"
          "$py" exhume/tools/audiocheck.py --exe uw1/build/port/uw1port --data "$UW1_DATA" --rec uw1/tests/replay/soundmt.rec --cfg uw1/tests/replay/soundmt.cfg --roms "$MT32_ROMS" --digests uw1/tests/replay/audio
      - name: Upload the difference pictures and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-macos-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/logs/*.log
            uw1/build/replay/verify/**/diff_ck*.png
            uw1/build/replay/verify/**/port.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the game data and everything built from it
        if: always()
        run: rm -rf "$RUNNER_TEMP/uw1-assets" "$RUNNER_TEMP/uw1-ci-assets" "$RUNNER_TEMP/uw1-assets-deploy-key" uw1/build
