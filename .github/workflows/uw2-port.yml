# The native port builds on Linux, macOS and Windows (docs/BUILDING.md, "Continuous
# integration"): make port (compile and link with SDL3) and make port-check (the compile-only
# measurement). Only the sources are needed: no game data, no Borland toolchain and no secrets,
# so this runs on every push and every pull request, forks included. Nothing is run.
name: uw2-port
on:
  push:
    paths:
      - 'coop/**'
      - 'tests/coop/**'
      - 'uw2/**'
      - 'exhume'
      - '.gitmodules'
      - '.gitattributes'
      - 'docs/**'
      - '.github/**'
      - 'ci.toml'
      - 'Makefile'
    branches: ['**']
  pull_request:
    paths:
      - 'coop/**'
      - 'tests/coop/**'
      - 'uw2/**'
      - 'exhume'
      - '.gitmodules'
      - '.gitattributes'
      - 'docs/**'
      - '.github/**'
      - 'ci.toml'
      - 'Makefile'
permissions:
  contents: read
concurrency:
  group: uw2-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clang ninja-build pkg-config >/dev/null
      - name: Cache SDL3 and libmt32emu
        uses: actions/cache@v6
        with:
          path: uw2/tools/libs
          key: libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uw2/tools/setup-libs.sh') }}
      - name: Build SDL3 and libmt32emu (when not cached), fetch Nuked OPL3
        run: |
          make -C uw2 setup-libs
          echo "PKG_CONFIG_PATH=$PWD/uw2/tools/libs/lib/pkgconfig" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH=$PWD/uw2/tools/libs/lib/pkgconfig make -C uw2 setup-sound
      - run: make -C uw2 port
      - run: make -C uw2 port-check

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      # Emscripten, pinned to the version the web build is made with (docs/WEB.md), in ~/emsdk
      # where the Makefile's web target sources it
      - name: Cache Emscripten
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('exhume/tools/setup-emsdk.sh') }}-4.0.15
      - name: Install Emscripten
        run: EMSDK_VERSION=4.0.15 sh exhume/tools/setup-emsdk.sh
      - name: Cache the web libraries
        uses: actions/cache@v6
        with:
          path: uw2/tools/libs-web
          key: libs-web-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('exhume/tools/setup-libs.sh', 'exhume/tools/setup-emsdk.sh') }}-4.0.15
      - name: Build SDL3 and libmt32emu for WebAssembly (when not cached)
        run: |
          # shellcheck source=/dev/null
          . ~/emsdk/emsdk_env.sh >/dev/null 2>&1
          SETUP_WEB=1 sh exhume/tools/setup-libs.sh uw2/tools/libs-web
      - name: Fetch Nuked OPL3 (the web build has the FM music as the desktop one does)
        run: make -C uw2 setup-sound
      - run: make -C uw2 web

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Homebrew packages
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install sdl3 mt32emu pkgconf
      - run: make -C uw2 setup-sound
      - run: make -C uw2 port
      - run: make -C uw2 port-check

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # the scripts must keep their LF line ends for MSYS2's sh
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      # MSYS2's CLANG64 environment: clang targeting the Universal C Runtime, SDL3 and
      # pkg-config from its packages; no libmt32emu, so the Windows build has no MT-32
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: make curl
          pacboy: clang:p llvm:p pkgconf:p sdl3:p python:p
      - run: make -C uw2 setup-sound
      - run: make -C uw2 PY=python port
      - run: make -C uw2 PY=python port-check
