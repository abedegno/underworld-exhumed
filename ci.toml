release_name = "          name: Ultima Underworld port ${{ steps.ver.outputs.v }}"
release_name_step = '''
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: uw1/CHANGELOG.md
          sparse-checkout-cone-mode: false
      # the version (uw2-v1.2.1-rc1 gives 1.2.1-rc1) and its notes: the CHANGELOG section of
      # the version without its -rc part, "(unreleased)" for a candidate
      - id: ver
        run: |
          v=${GITHUB_REF_NAME#*-v}; echo "v=$v" >> "$GITHUB_OUTPUT"
          base=${v%%-*}
          awk -v b="## $base " 'index($0, b) == 1 { f = 1; next } /^## / { if (f) exit } f' uw1/CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::uw1/CHANGELOG.md has no section for $base"; exit 1; }
          cat notes.md'''
release_notes = "          body_path: notes.md"
port_push_branches = '''

    branches: ['**']'''
release_test_jobs = '''
  test-windows:
    # the Windows zip on each Windows: unpacked, started with only Windows's folders on the PATH,
    # every session replayed with it, and the MT-32's audio
    if: (startsWith(github.ref, 'refs/tags/uw1-v') || github.event_name != 'push') && github.actor != 'dependabot[bot]'
    needs: [windows]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: make git
          pacboy: python:p
      - name: age
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'age.zip'
          Invoke-WebRequest -Uri 'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-windows-amd64.zip' -OutFile $zip
          $sum = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne 'f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7') { throw "age: unexpected SHA-256 $sum" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'age-bin')
          Join-Path $env:RUNNER_TEMP 'age-bin\age' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: ./.github/actions/uw1-assets
        with:
          deploy-key: ${{ secrets.UW1_ASSETS_DEPLOY_KEY }}
          age-key: ${{ secrets.UW1_ASSETS_AGE_KEY }}
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - name: The zip, as a player gets it
        run: |
          set -o pipefail
          exe=$(python exhume/tools/pkgcheck.py "$(ls dist/UW1-*-windows-x86_64.zip)" --exe uw1port --data "$UW1_DATA" --unpack "$RUNNER_TEMP/pkg")
          EXHUME_PORT="$exe" make -C uw1 PY=python verify
          python exhume/tools/audiocheck.py --exe "$exe" --data "$UW1_DATA" --rec uw1/tests/replay/soundmt.rec --cfg uw1/tests/replay/soundmt.cfg --roms "$MT32_ROMS" --digests uw1/tests/replay/audio
      - name: Remove the game data and everything built from it
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/uw1-assets" "$RUNNER_TEMP/uw1-ci-assets" "$RUNNER_TEMP/uw1-assets-deploy-key" dist uw1/build

  test-macos:
    # the app on each macOS: unpacked, started, every session replayed with it, the MT-32's audio,
    # and on a tag Gatekeeper's verdict on the notarised app
    if: (startsWith(github.ref, 'refs/tags/uw1-v') || github.event_name != 'push') && github.actor != 'dependabot[bot]'
    needs: [macos]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: age
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install age
      - uses: ./.github/actions/uw1-assets
        with:
          deploy-key: ${{ secrets.UW1_ASSETS_DEPLOY_KEY }}
          age-key: ${{ secrets.UW1_ASSETS_AGE_KEY }}
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist
      - name: The app, as a player gets it
        run: |
          set -o pipefail
          exe=$(python3 exhume/tools/pkgcheck.py "$(ls dist/UW1-*-macos.zip)" --exe uw1port --data "$UW1_DATA" --unpack "$RUNNER_TEMP/pkg")
          EXHUME_PORT="$exe" make -C uw1 PY=python3 verify
          python3 exhume/tools/audiocheck.py --exe "$exe" --data "$UW1_DATA" --rec uw1/tests/replay/soundmt.rec --cfg uw1/tests/replay/soundmt.cfg --roms "$MT32_ROMS" --digests uw1/tests/replay/audio
      - name: Gatekeeper accepts the notarised app
        if: startsWith(github.ref, 'refs/tags/uw1-v')
        run: |
          app=$(find "$RUNNER_TEMP/pkg" -maxdepth 3 -name '*.app' | head -1)
          spctl -a -vv -t exec "$app" 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
      - name: Remove the game data and everything built from it
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/uw1-assets" "$RUNNER_TEMP/uw1-ci-assets" "$RUNNER_TEMP/uw1-assets-deploy-key" dist uw1/build

  test-linux:
    # the tarball and the AppImage in clean containers, from the oldest glibc promised (Ubuntu 22.04)
    if: (startsWith(github.ref, 'refs/tags/uw1-v') || github.event_name != 'push') && github.actor != 'dependabot[bot]'
    needs: [linux]
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "fedora:41"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 60
    steps:
      - name: The container's tools (git, ssh, age, make, Python)
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git openssh-client age make python3 ca-certificates >/dev/null
          else dnf install -y -q git openssh-clients age make python3; fi
          # Exhume's tools need Python 3.11 (tomllib); Ubuntu 22.04's python3 is 3.10
          if ! python3 -c 'import tomllib' 2>/dev/null; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3.11 >/dev/null && ln -sf "$(command -v python3.11)" /usr/local/bin/python3
          fi
          python3 --version
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/uw1-assets
        with:
          deploy-key: ${{ secrets.UW1_ASSETS_DEPLOY_KEY }}
          age-key: ${{ secrets.UW1_ASSETS_AGE_KEY }}
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - name: The tarball, as a player gets it
        shell: bash
        run: |
          set -o pipefail
          exe=$(python3 exhume/tools/pkgcheck.py "$(ls dist/UW1-*-linux-x86_64.tar.gz)" --exe uw1port --data "$UW1_DATA" --unpack "$RUNNER_TEMP/pkg")
          EXHUME_PORT="$exe" make -C uw1 PY=python3 verify
          python3 exhume/tools/audiocheck.py --exe "$exe" --data "$UW1_DATA" --rec uw1/tests/replay/soundmt.rec --cfg uw1/tests/replay/soundmt.cfg --roms "$MT32_ROMS" --digests uw1/tests/replay/audio
      - name: The AppImage, as a player gets it
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -o pipefail
          exe=$(python3 exhume/tools/pkgcheck.py "$(ls dist/UW1-*-linux-x86_64.AppImage)" --exe uw1port --data "$UW1_DATA" --unpack "$RUNNER_TEMP/pkg")
          EXHUME_PORT="$exe" make -C uw1 PY=python3 verify
          python3 exhume/tools/audiocheck.py --exe "$exe" --data "$UW1_DATA" --rec uw1/tests/replay/soundmt.rec --cfg uw1/tests/replay/soundmt.cfg --roms "$MT32_ROMS" --digests uw1/tests/replay/audio
      - name: Remove the game data and everything built from it
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/uw1-assets" "$RUNNER_TEMP/uw1-ci-assets" "$RUNNER_TEMP/uw1-assets-deploy-key" dist uw1/build
'''
nightly_extra_step = '''
      # UW1's sound session replays only in js-dos (exhume.toml [replay] dos_backend), which runs
      # in dos-mcp's headless Chrome; the Linux tools leave it out, so it is installed here
      - name: dos-mcp's Chrome, for js-dos
        run: |
          sudo apt-get install -y -qq --no-install-recommends libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libasound2t64 libxfixes3 >/dev/null
          npx --prefix exhume puppeteer browsers install chrome'''
draft_needs = "[macos, linux, windows, test-windows, test-macos, test-linux]"
release_schedule = '''
  schedule:
    # weekly, Mondays: the packages built and tested with no draft, so a change in the runners
    # or a dependency shows between releases
    - cron: '23 4 * * 1''''
mt32_step = '''
      - name: "MT-32: how the port finds the ROMs, and soundmt's audio"
        run: |
          py=$(command -v python3 || command -v python)
          "$py" exhume/tools/romcheck.py --exe uw1/build/port/uw1port --data "$UW1_DATA" --roms "$MT32_ROMS" --env UW1PORT_MT32_ROMS --sound 6,1 --split "$MT32_ROMS-split"
          "$py" exhume/tools/audiocheck.py --exe uw1/build/port/uw1port --data "$UW1_DATA" --rec uw1/tests/replay/soundmt.rec --cfg uw1/tests/replay/soundmt.cfg --roms "$MT32_ROMS" --digests uw1/tests/replay/audio'''
exhume_checkout = ""
checkout_submodules = "          submodules: true"
nightly_extra_jobs = '''

  exhume-master:
    # make test with Exhume's latest master in place of the pinned submodule: a change in Exhume
    # that would break this game shows here before the submodule is moved to it
    if: vars.UW1_CI_ASSETS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Exhume's latest master
        run: git -C exhume fetch -q origin master && git -C exhume checkout -q FETCH_HEAD && git -C exhume log --oneline -1
      - uses: ./.github/actions/uw1-linux-tools
      - uses: ./.github/actions/uw1-assets
        with:
          deploy-key: ${{ secrets.UW1_ASSETS_DEPLOY_KEY }}
          age-key: ${{ secrets.UW1_ASSETS_AGE_KEY }}
      - name: Unpack Turbo C++ and TASM from the bundle's disk images
        run: sh exhume/profiles/borland-tc101/setup-tc.sh "$TC_DISKS" toolchain/TC && sh exhume/profiles/borland-tc101/setup-tasm.sh "$TASM_DISKS" toolchain/TASM && printf 'EXHUME_TC=%s\nEXHUME_TASM=%s\n' "$PWD/toolchain/TC" "$PWD/toolchain/TASM" >> "$GITHUB_ENV"
      - name: make test against Exhume master
        run: make -C uw1 test
      - name: Remove the game data and everything built from it
        if: always()
        run: rm -rf "$RUNNER_TEMP/uw1-assets" "$RUNNER_TEMP/uw1-ci-assets" "$RUNNER_TEMP/uw1-assets-deploy-key" toolchain uw1/build'''

