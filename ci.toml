# Underworld Exhumed's CI values: python3 exhume/tools/citemplates.py --vars ci.toml .
# writes .github/ from Exhume's templates. repocheck.yml once; each game's workflows from its [[games]] table.

nightly_cron = "17 3 * * *"
accuracy_comment = '''
# make test, the accuracy suite (docs/BUILDING.md, "Testing" and "Continuous integration"):
# the byte-exact DOS build gate, the port build, the quick routine fuzzing and every replay
# session against their goldens, on Linux. Then the same sessions replayed by the port
# built on Windows (MSYS2 CLANG64) and on macOS against the same goldens (make verify): the
# goldens are DOS's, so these show the port on each OS runs the game as DOS does. They need
# the game, and the gate the Borland toolchain, which come from the private bundle (the
# game's assets action), so the jobs run only where the repository's secrets are given: pushes
# to main, a manual run, and pull requests from branches of this repository. A pull request
# from a fork gets port.yml and repocheck.yml, which need no secrets.'''
nightly_comment = '''
# make test-full, nightly (docs/BUILDING.md, "Testing" and "Continuous integration"): the gate,
# both port builds, every golden made again from DOS in DOSBox-X (each session twice, checked
# identical), the sessions in the port and in the UBSan build, the sound drivers against the
# real ones, the deep routine fuzzing and the coverage report. Like accuracy.yml it needs the
# private bundle, so it runs only on the schedule and by hand. The job fails when a regenerated
# golden differs from the committed one, and the coverage totals go to the job summary.'''
port_comment = '''
# The native port builds on Linux, macOS and Windows (docs/BUILDING.md, "Continuous
# integration"): make port (compile and link with SDL3) and make port-check (the compile-only
# measurement). Only the sources are needed: no game data, no Borland toolchain and no secrets,
# so this runs on every push and every pull request, forks included. Nothing is run.'''
release_comment = '''
# Release packages of the native port (docs/BUILDING.md, "Releases"): on a tag v*, build the port
# on macOS (one universal app for arm64 and x86_64), Linux (x86-64, on Ubuntu 22.04 for glibc
# 2.35: a tarball and an AppImage) and Windows (x86-64, MSYS2 CLANG64), package each with
# tools/package.py, and attach the packages and the source of the LGPL libraries to a DRAFT
# release, which the owner reviews and publishes by hand. Run by hand (workflow_dispatch), it
# builds the packages as workflow artifacts and makes no release.
# Only the sources are needed: no game data and no Borland toolchain. The only secrets are
# Apple's, for the macOS app: with CSC_LINK set it is signed with the Developer ID identity, and
# on a tag (or by hand with notarise) notarised and stapled; without them it is signed ad hoc.'''
repocheck_comment = '''
# tools/repocheck.py (Python and script syntax, Markdown links, no game data or Borland
# binaries committed), which needs neither the Borland toolchain nor UW2.EXE, so it runs on
# every push and pull request, forks included. The gate itself runs in the pre-push hook
# (`make hooks`) and in accuracy.yml (docs/BUILDING.md, "Continuous integration").'''
linux_tools_comment = '''
# The Linux side of `make setup` for CI (docs/BUILDING.md, "Continuous integration"): system
# packages, Python with tools/requirements.txt in .venv, Node with dos-mcp, and the tools built
# from source (emu2, SDL3 and libmt32emu, Nuked OPL3), each cached by the script that pins it.
# Nothing here touches the game or the Borland toolchain, so every cached path is free of both.'''
assets_comment = '''
# Fetch and decrypt the CI asset bundle (docs/BUILDING.md, "Continuous integration"): the
# owner's UW2 game files and Borland disk images, from the private repository uw2-ci-assets,
# with its read-only deploy key, decrypted with the age key into $RUNNER_TEMP/uw2-assets. Sets
# UW2_EXE, UW2_DIR, TC_DISKS and TASM_DISKS for the later steps. Nothing is listed or printed.
# The calling workflow must remove $RUNNER_TEMP/uw2-assets, TC, TASM and build in a final
# `if: always()` step, and must never cache or upload anything from them. Needs git, ssh, tar
# and age on the PATH: Linux and macOS runners (age from apt or Homebrew), and Windows, where
# bash is Git Bash and the job puts the official age build on the PATH first (accuracy.yml).'''
release_linux_python = '''
      # Exhume's tools need Python 3.11 or later (tomllib); Ubuntu 22.04 has 3.10
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"'''
test_full_summary = "==== test full:"
setup_name = "Unpack Turbo C++ and TASM from the bundle's disk images"
repocheck_env = ""
repocheck = "make repocheck"
repocheck_exhume_checkout = '''
        with:
          submodules: true'''
